#
# Default configuration
#
# Shipped inside the package, so it resolves by module location rather than by
# working directory. Override selected keys with `asa --config <file>`.

[project]
# The design document this build implements — "ASA Design vn.n" in the Obsidian
# vault. Copied into every run manifest so recorded results point back at the
# reasoning behind them, not just at the code. A claim, not a check: bump it when
# the design version bumps.
design_version = "v0.6.1"

[furhat]
# 127.0.0.1 is the virtual Furhat in the local SDK. A physical robot is its address
# on the network — the same adapter, a different target.
host = "127.0.0.1"
