#
# ── Project definition ────────────────────────────────────────────────────────
# Packaged project: it HAS a [build-system], so uv builds this repo and installs
# it into .venv. That install is what makes `import asa` resolve everywhere —
# tests, notebooks, the console script — with no sys.path juggling.
#
[project]
name = "asa-research-prototype"
version = "0.1.0"
description = "Research prototype for a basic Artificial Social Agent — uv-managed, packaged."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Stuart Gow", email = "gowstuart@gmail.com" }]
requires-python = ">=3.12,<3.13"

# Dependencies
dependencies = []

# ── Run entry points ──────────────────────────────────────────────────────────
# Installs an `asa` console command that calls asa.cli.main(). It only exists if
# the package genuinely built and installed, so it doubles as a packaging check.
[project.scripts]
asa = "asa.cli:main"

# ── Build backend ─────────────────────────────────────────────────────────────
[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

# uv_build defaults the module directory to the normalised project name, which
# would mean src/asa_research_prototype/ and `import asa_research_prototype`.
# Override just the module: the distribution stays `asa-research-prototype`
# (matching the repo, the GitHub URL and CITATION.cff) while imports stay short.
[tool.uv.build-backend]
module-name = "asa"

# ── Dependency groups (PEP 735) ───────────────────────────────────────────────
# Dev-only tooling that never ships in the wheel. `uv sync` installs the `dev`
# group by default; `dev` pulls in `notebook` too, so one `uv sync` gives a
# working notebook + test + lint environment. CI can use `--no-default-groups`.
[dependency-groups]
notebook = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.6.1",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
]
dev = [
    "ruff>=0.15.20",
    "autopep8>=2.3.2",  # formatter over `ruff format`: preserves hand-arranged signatures (ruff stacks all-or-nothing)
    "pytest>=9.1.1",
    { include-group = "notebook" },
]

# ── Tooling config ────────────────────────────────────────────────────────────
# No target-version: ruff infers it from requires-python above, so setting it
# would just be a second place to forget to update.
[tool.ruff]
line-length = 120  # kept in sync with [tool.autopep8] max_line_length below

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade, B = bugbear, Q = quotes (double)
select = ["E", "F", "I", "UP", "B", "Q"]

# More relaxed about line-length format in Notebooks
[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# No `pythonpath` here — unlike dev-conv-agent, this project is installed into
# .venv, so `import asa` resolves without putting the repo root on sys.path.

# ── Formatter config ──────────────────────────────────────────────────────────
# autopep8 is the formatter, NOT `ruff format`: it enforces PEP 8 but leaves
# hand-arranged signatures alone, whereas ruff format stacks params all-or-nothing.
[tool.autopep8]
max_line_length = 120  # mirror [tool.ruff] line-length so the two never disagree
